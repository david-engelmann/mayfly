[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayfly"
version = "0.1.0"
description = "A disposable sandbox harness for agent tasks, with a Linux namespace backend in slice 1"
requires-python = ">=3.11"

[project.scripts]
mayfly = "mayfly.cli:main"

[tool.setuptools]
packages = ["mayfly", "mayfly.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
