[package]
name = "mayfly"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
default-run = "mayfly"
description = "Runs one command in a disposable directory with a scrubbed environment and the network off by default, mirrors the command's exit code, and deletes the directory when the command ends."
license = "MIT"
readme = "README.md"
repository = "https://github.com/david-engelmann/mayfly"
homepage = "https://github.com/david-engelmann/mayfly"
documentation = "https://docs.rs/mayfly"
keywords = ["sandbox", "namespace", "isolation", "linux", "agent"]
categories = ["command-line-utilities", "os::linux-apis"]
exclude = [".github/**"]

[lib]
name = "mayfly"
path = "src/lib.rs"

[[bin]]
name = "mayfly"
path = "src/bin/mayfly.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.3"
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
