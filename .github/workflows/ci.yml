name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy
      - name: Run the local gate
        run: cargo test
      - name: Run the codepoint scan
        run: cargo run --bin codepoint_scan
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --all-targets -- -D warnings
